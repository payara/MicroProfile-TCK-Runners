#Payara Micro Logging Properties File (payara-micro-managed profile)
#
# Based on Payara Micro's default MICRO-INF/domain/logging.properties, with an
# extra FileHandler added. The full-server profile points the logs TCK at
# server.log and switches its format to CustomLoggerFormatter (via
# set-log-file-format); Micro has no server.log, so we add a FileHandler that
# writes to ${micro.otel.log.file} (filtered in by Maven) using that same
# formatter. CustomLoggerFormatter appends " scopeInfo:full" to every record,
# which is what JulTest's ".*scopeInfo:.*" assertion looks for. The formatter
# class lives in this module's jar, baked into the MICRO-INF/lib of a custom
# Micro uber jar (see the pom) so it is on the boot classloader that
# PayaraMicroImpl.resetLogging() uses to instantiate this formatter.
#
# The ConsoleHandler is kept so the Arquillian Micro connector still sees the
# startup banner on the console and detects that the instance has started.

## Handlers
handlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler
java.util.logging.ConsoleHandler.formatter=com.sun.enterprise.server.logging.ODLLogFormatter
com.sun.enterprise.server.logging.ODLLogFormatter.ansiColor=true
java.util.logging.ConsoleHandler.level=FINE

## File handler capturing log output for the logs TCK, using the TCK formatter
java.util.logging.FileHandler.pattern=${micro.otel.log.file}
java.util.logging.FileHandler.level=FINE
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.formatter=fish.payara.microprofile.telemetry.tck.CustomLoggerFormatter

## Global Level
.level=INFO

