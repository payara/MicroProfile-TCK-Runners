# System properties handed to Payara Micro (via --systemproperties) for the
# payara-micro-managed profile. Mirrors the asadmin create-system-property call
# the full-server profile uses, which is guarded unless="payara.micro.managed".
#
# ${micro.otel.log.file} is filtered in by Maven (see the payara-micro-managed
# profile) and must match the file the FileHandler in micro-logging.properties
# writes to, so the logs TCK (JulTest) can find the logged messages. JulTest
# reads this value via System.getProperty, so it must be a JVM system property.
mptelemetry.tck.log.file.path=${micro.otel.log.file}
