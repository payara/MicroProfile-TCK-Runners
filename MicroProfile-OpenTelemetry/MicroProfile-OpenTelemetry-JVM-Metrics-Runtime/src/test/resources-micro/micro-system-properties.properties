# System properties handed to Payara Micro (via --systemproperties) for the
# payara-micro-managed profile. These mirror the asadmin create-system-property
# calls the full-server profiles use, which are guarded unless="payara.micro.managed".
#
# ${micro.otel.log.file} is filtered in by Maven (see the payara-micro-managed
# profile) and must match the file the FileHandler in micro-logging.properties
# writes to, so the metrics TCK's MetricsReader can find the exported metrics.
otel.sdk.disabled=false
otel.metrics.exporter=logging
otel.traces.exporter=none
otel.logs.exporter=none
otel.metric.export.interval=3000
mptelemetry.tck.log.file.path=${micro.otel.log.file}
